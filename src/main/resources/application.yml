spring:
  application:
    name: ticketwise
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  timeout-ms: ${GEMINI_TIMEOUT_MS:5000}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

jwt:
  secret: ${JWT_SECRET:}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
