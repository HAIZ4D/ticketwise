services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ticketwise
      POSTGRES_USER: ${DB_USERNAME:-ticketwise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticketwise}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/ticketwise
      DB_USERNAME: ${DB_USERNAME:-ticketwise}
      DB_PASSWORD: ${DB_PASSWORD:-ticketwise}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-5000}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  web:
    build: ./frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"

volumes:
  postgres-data:
